---
version: '3'
volumes:
  sbt-cache:
  ivy2-cache:
  cache:
services:
  elements:
    image: docker.io/dnltz/elements:v2.6
    container_name: elemrv_container
    environment:
      - DISPLAY=${DISPLAY}
    ports:
      # Renode UART0 socket terminal
      - "3456:3456"
      # OpenOCD ports
      - "3333:3333"
      - "4444:4444"
      - "6666:6666"
    volumes:
      - /home:/home
      - ivy2-cache:/root/.ivy2
      - sbt-cache:/root/.sbt
      - cache:/root/.cache
      - $XAUTHORITY:$XAUTHORITY:ro
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - /dev/:/dev/
    command: ["sleep", "infinity"]
