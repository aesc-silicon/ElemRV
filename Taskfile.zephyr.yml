version: '3'

vars:
  arch:
    sh: |
      case "{{.SOC}}" in
        ElemRV-H) echo "rv32i_zicsr" ;;
        ElemRV-C) echo "rv32imc_zicsr" ;;
        ElemRV-N) echo "rv32im_zicsr" ;;
        *) echo ""; echo "Unknown SOC: {{.SOC}}" >&2; exit 1 ;;
      esac

tasks:
  compile:
    desc: Compiles the bootrom and Zephyr firmware and packages them into an image container.
    preconditions:
      - sh: 'test -f {{.BUILD_ROOT}}/{{.SOC}}/firmware/storages.yaml'
        msg: "Design not generated. Run 'task SOC={{.SOC}} asic:prepare' first."
    cmds:
      - task: ':lib-baremetal-firmware'
        vars:
          app: "bootrom"
      - task: ':lib-zephyr-firmware'
        vars:
          boardname: "elemrv_flask/{{.package}}"
          app: "{{.ZEPHYR_APP | default \"modules/elements/zephyr/samples/basic/blinky\"}}"
      - "{{.RUN}} './software/{{.package}}/gen_zephyr_container.sh'"
      - "{{.RUN}} 'ln -sf {{.BUILD_ROOT}}/{{.SOC}}/firmware/zephyr_container.img {{.BUILD_ROOT}}/{{.SOC}}/firmware/image_container.img'"
