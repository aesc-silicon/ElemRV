version: '3'

includes:
  lib:
    taskfile: ./modules/elements/zibal/Taskfile.yaml
    optional: true
    flatten: true
  fpga:
    taskfile: ./Taskfile.fpga.yml
  baremetal:
    taskfile: ./Taskfile.baremetal.yml
  zephyr:
    taskfile: ./Taskfile.zephyr.yml

vars:
  SOC: '{{.SOC | default "ElemRV-N"}}'
  PDK: '{{.PDK | default "ihp-sg13g2"}}'
  TECH:
    sh: |
      case "{{.PDK}}" in
        ihp-sg13g2) echo "sg13g2" ;;
        ihp-sg13cmos5l) echo "sg13cmos5l" ;;
        sky130A)    echo "sky130" ;;
        gf180mcuD)  echo "gf180mcu" ;;
        *) echo ""; echo "Unknown PDK: {{.PDK}}" >&2; exit 1 ;;
      esac
  PDK_FAMILY:
    sh: |
      case "{{.PDK}}" in
        ihp-sg13g2) echo "ihp-sg13g2" ;;
        ihp-sg13cmos5l) echo "ihp-sg13g2" ;;
        sky130A)    echo "sky130" ;;
        gf180mcuD)  echo "gf180mcu" ;;
        *) echo ""; echo "Unknown PDK: {{.PDK}}" >&2; exit 1 ;;
      esac
  PDK_ORFS:
    sh: |
      case "{{.PDK}}" in
        ihp-sg13g2) echo "ihp-sg13g2" ;;
        ihp-sg13cmos5l) echo "ihp-sg13g2" ;;
        sky130A)    echo "sky130hd" ;;
        gf180mcuD)  echo "gf180" ;;
        *) echo ""; echo "Unknown PDK: {{.PDK}}" >&2; exit 1 ;;
      esac
  PDK_HASH:
    sh: |
      case "{{.PDK}}" in
        ihp-sg13g2) echo "5cccb161f7492697cfa52eb14dc03beb00bdca9e" ;;
        ihp-sg13cmos5l) echo "5cccb161f7492697cfa52eb14dc03beb00bdca9e" ;;
        sky130A)    echo "7b70722e33c03fcb5dabcf4d479fb0822d9251c9" ;;
        gf180mcuD)  echo "7b70722e33c03fcb5dabcf4d479fb0822d9251c9" ;;
        *) echo ""; echo "Unknown PDK: {{.PDK}}" >&2; exit 1 ;;
      esac

  package:
    sh: echo "{{.SOC}}" | tr '[:upper:]' '[:lower:]' | tr '-' '_'
  board:
    sh: echo "{{.TECH}}" | tr '[:lower:]' '[:upper:]'

  KLAYOUT_HOME: "{{.PWD}}/pdks/IHP-Open-PDK/{{.PDK}}/libs.tech/klayout/"
  CONTAINER_NAME: elemrv_container
  CONTAINER_ENV: " \
    -e TECH={{.TECH}} \
    -e PDK={{.PDK}} \
    -e PDK_FAMILY={{.PDK_FAMILY}} \
    -e PDK_ROOT={{.PDK_ROOT}} \
    -e SOC={{.SOC}} \
    -e BOARD={{.board}} \
    -e FPGA_FAMILY={{.FPGA_FAMILY}} \
    -e FPGA_DEVICE={{.FPGA_DEVICE}} \
    -e FPGA_PACKAGE={{.FPGA_PACKAGE}} \
    -e FPGA_FREQUENCY={{.FPGA_FREQUENCY}} \
    -e KLAYOUT_HOME={{.KLAYOUT_HOME}} \
    -e NAFARR_BASE={{.NAFARR_BASE}} \
    -e ZIBAL_BASE={{.ZIBAL_BASE}} \
    -e VEXRISCV_ROOT={{.VEXRISCV_ROOT}} \
    -e BUILD_ROOT={{.BUILD_ROOT}} \
    -e USER={{.USER}} \
    -e ZEPHYR_SDK_INSTALL_DIR={{.ZEPHYR_SDK_INSTALL_DIR}} \
    -e GCC={{.GCC}} \
    -e RULES_JSON={{.PWD}}/hardware/scala/{{.package}}/{{.board}}/rules.json \
"

env:
  FPGA_FAMILY: ecp5
  FPGA_DEVICE: um5g-45k
  FPGA_PACKAGE: CABGA554
  FPGA_FREQUENCY: 50
  OPENFPGALOADER_BOARD: ecpix5_r03
  PDK_ROOT: "{{.PWD}}/pdks"
  NAFARR_BASE: "{{.PWD}}/modules/elements/nafarr/"
  ZIBAL_BASE: "{{.PWD}}/modules/elements/zibal/"
  VEXRISCV_ROOT: "{{.PWD}}/modules/elements/vexriscv/"
  BUILD_ROOT: "{{.PWD}}/build/"
  ZEPHYR_SDK_INSTALL_DIR: "/opt/elements/zephyr-sdk-1.0.1"
  GCC: "{{.ZEPHYR_SDK_INSTALL_DIR}}/gnu/riscv64-zephyr-elf/bin/riscv64-zephyr-elf"
  OPENROAD_FLOW_ROOT: "{{.PWD}}/tools/OpenROAD-flow-scripts/flow"

tasks:
  _project-prepare:
    cmds:
      - virtualenv venv
      - venv/bin/pip3 install podman-compose==1.0.6
      - curl https://storage.googleapis.com/git-repo-downloads/repo > repo
      - chmod a+rx repo
      - ./repo init -u https://github.com/aesc-silicon/ElemRV.git -b {{if .branch}}{{.branch}}{{else}}main{{end}} -m manifest{{.manifest_suffix}}.xml

  _build-container:
    cmds:
      - |
        {{if .CI -}}
        CONTAINER_IMAGE=$(grep 'image:' podman-compose-headless.yml | awk '{print $2}')
        CACHE_DIR="$HOME/.podman-cache"
        CACHE_TAG=$(echo "$CONTAINER_IMAGE" | sed 's/[\/:]/-/g')
        CACHE_FILE="$CACHE_DIR/${CACHE_TAG}.tar"
        mkdir -p "$CACHE_DIR"
        if [ -f "$CACHE_FILE" ]; then
          podman load -q -i "$CACHE_FILE"
        else
          podman pull -q "$CONTAINER_IMAGE"
          podman save -o "$CACHE_FILE" "$CONTAINER_IMAGE"
        fi
        {{- else -}}
        venv/bin/podman-compose pull
        {{- end}}

  repo-sync:
    desc: Downloads and synchronizes all required dependencies.
    cmds:
      - ./repo sync {{if .CI}}-q{{end}}
      - ./repo forall modules/elements/vexiiriscv -c 'git submodule update --init --recursive'

  install:
    desc: Installs all dependencies and prepares the project for FPGA and chip workflows.
    cmds:
      - task: _project-prepare
      - task: _build-container
      - task: repo-sync
    vars:
      branch: "main"
      manifest_suffix: ""

  install-zephyr:
    desc: Initializes the Zephyr workspace and fetches all Zephyr dependencies.
    cmds:
      - task: west-init
      - task: west-update

  prepare:
    desc: Generates all necessary source files and metadata for chip layout creation.
    cmds:
      - task: lib-sbt-publishLocal
        vars:
          project: "modules/elements/vexiiriscv"
      - task: lib-generate
      - task: lib-sealring
      - "mkdir -p {{.BUILD_ROOT}}/{{.SOC}}/{{.board}}/zibal/macros/bondpad"
      - "cp tmp/{{.PDK}}/bondpad_70x70.lef {{.BUILD_ROOT}}/{{.SOC}}/{{.board}}/zibal/macros/bondpad/"
      - "cp tmp/{{.PDK}}/bondpad_70x70.gds.gz {{.BUILD_ROOT}}/{{.SOC}}/{{.board}}/zibal/macros/bondpad/bondpad_70x70.gds.gz"
      # TODO: wait until bondpad.py got fixed
      #- task: lib-bondpad

  simulate:
    desc: Runs simulations at the RTL level. Add 'duration=n' to specify the duration in n milliseconds.
    cmds:
      - task: lib-simulate

  view-simulation:
    desc: Opens the simulation with GTKWave.
    cmds:
      - task: lib-view-simulation

  layout:
    desc: Creates the physical layout of the chip.
    cmds:
      - task: lib-layout

  update-metadata:
    desc: Generates ORFS metadata and updates design rules after layout completion.
    cmds:
      - task: lib-update-metadata

  filler:
    desc: Inserts filler cells into the layout to ensure proper chip functionality.
    cmds:
      - task: lib-filler

  run-drc:
    desc: Performs Design Rule Checks and reports violations; use 'level=minimal' for a basic check.
    cmds:
      - task: lib-run-drc

  view-drc:
    desc: Displays DRC results in KLayout; 'level=minimal' opens minimal deck results.
    cmds:
      - task: lib-view-drc

  view-openroad:
    desc: Loads the layout into OpenROAD for further analysis or modification.
    cmds:
      - task: lib-view-openroad

  view-klayout:
    desc: Opens the chip layout in KLayout for inspection.
    cmds:
      - task: lib-view-klayout

  check-logs:
    desc: Checks the build directory for warnings or errors in the logs.
    cmds:
      - task: lib-check-logs

  check-metadata:
    desc: Validates the ORFS metadata against the expected design rules.
    cmds:
      - task: lib-check-metadata

  default:
    desc: Executes the full IHP SG13G2 RTL-to-GDSII flow and validates the layout afterwards.
    cmds:
      - task: prepare
      - task: layout
      - task: filler
      - task: run-drc
      - task: check-logs
      - task: check-metadata
