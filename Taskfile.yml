version: '3'

includes:
  lib:
    taskfile: ./modules/elements/zibal/Taskfile.yaml
    optional: true
    flatten: true
  fpga:
    taskfile: ./Taskfile.fpga.yml
  baremetal:
    taskfile: ./Taskfile.baremetal.yml
  zephyr:
    taskfile: ./Taskfile.zephyr.yml
  flash:
    taskfile: ./Taskfile.flash.yml
  jtag:
    taskfile: ./Taskfile.jtag.yml
  asic:
    taskfile: ./Taskfile.asic.yml
  sim:
    taskfile: ./Taskfile.sim.yml

vars:
  SOC: '{{.SOC | default "ElemRV-N"}}'
  # ASIC target = process node + on-chip config (SG13CMOS5L, GF180MCU, ...). Selects the PDK.
  TARGET: '{{.TARGET | default "SG13CMOS5L"}}'
  PDK:
    sh: |
      case "{{.TARGET}}" in
        SG13G2)     echo "ihp-sg13g2" ;;
        SG13CMOS5L) echo "ihp-sg13cmos5l" ;;
        GF180MCU)   echo "gf180mcuD" ;;
        SKY130)     echo "sky130A" ;;
        *) echo ""; echo "Unknown TARGET: {{.TARGET}}" >&2; exit 1 ;;
      esac
  TECH:
    sh: |
      case "{{.PDK}}" in
        ihp-sg13g2) echo "sg13g2" ;;
        ihp-sg13cmos5l) echo "sg13cmos5l" ;;
        sky130A)    echo "sky130" ;;
        gf180mcuD)  echo "gf180mcu" ;;
        *) echo ""; echo "Unknown PDK: {{.PDK}}" >&2; exit 1 ;;
      esac
  PDK_FAMILY:
    sh: |
      case "{{.PDK}}" in
        ihp-sg13g2) echo "ihp-sg13g2" ;;
        ihp-sg13cmos5l) echo "ihp-sg13g2" ;;
        sky130A)    echo "sky130" ;;
        gf180mcuD)  echo "gf180mcu" ;;
        *) echo ""; echo "Unknown PDK: {{.PDK}}" >&2; exit 1 ;;
      esac
  PDK_ORFS:
    sh: |
      case "{{.PDK}}" in
        ihp-sg13g2) echo "ihp-sg13g2" ;;
        ihp-sg13cmos5l) echo "ihp-sg13g2" ;;
        sky130A)    echo "sky130hd" ;;
        gf180mcuD)  echo "gf180" ;;
        *) echo ""; echo "Unknown PDK: {{.PDK}}" >&2; exit 1 ;;
      esac
  PDK_HASH:
    sh: |
      case "{{.PDK}}" in
        ihp-sg13g2) echo "5cccb161f7492697cfa52eb14dc03beb00bdca9e" ;;
        ihp-sg13cmos5l) echo "5cccb161f7492697cfa52eb14dc03beb00bdca9e" ;;
        sky130A)    echo "7b70722e33c03fcb5dabcf4d479fb0822d9251c9" ;;
        gf180mcuD)  echo "7b70722e33c03fcb5dabcf4d479fb0822d9251c9" ;;
        *) echo ""; echo "Unknown PDK: {{.PDK}}" >&2; exit 1 ;;
      esac

  package:
    sh: echo "{{.SOC}}" | tr '[:upper:]' '[:lower:]' | tr '-' '_'

  # Chip top-cell name. Drives the generated Verilog top module, ORFS DESIGN_NAME/
  # DESIGN_NICKNAME (hence the results dir and --topcell), and all generated file
  # names. Defaults to "<TARGET>Top" (the SpinalHDL class name) so existing SoCs
  # are unaffected. Override, e.g. 'TOPCELL=MyChipTop', to rename the whole design.
  TOPCELL: '{{.TOPCELL | default (printf "%sTop" .TARGET)}}'

  # Floorplan profiles:
  # "tapeout" (default) for the tight signoff core/die sizes.
  # "relaxed" for fast, robust iteration builds;
  FLOORPLAN: '{{.FLOORPLAN | default "tapeout"}}'

  KLAYOUT_HOME: "{{.PWD}}/pdks/IHP-Open-PDK/{{.PDK}}/libs.tech/klayout/"
  CONTAINER_NAME: elemrv_container
  CONTAINER_ENV: " \
    -e TECH={{.TECH}} \
    -e PDK={{.PDK}} \
    -e PDK_FAMILY={{.PDK_FAMILY}} \
    -e PDK_ROOT={{.PDK_ROOT}} \
    -e SOC={{.SOC}} \
    -e TARGET={{.TARGET}} \
    -e BOARD={{.TARGET}} \
    -e TOPCELL={{.TOPCELL}} \
    -e FLOORPLAN={{.FLOORPLAN}} \
    -e FPGA_FAMILY={{.FPGA_FAMILY}} \
    -e FPGA_DEVICE={{.FPGA_DEVICE}} \
    -e FPGA_PACKAGE={{.FPGA_PACKAGE}} \
    -e FPGA_FREQUENCY={{.FPGA_FREQUENCY}} \
    -e KLAYOUT_HOME={{.KLAYOUT_HOME}} \
    -e ZIBAL_BASE={{.ZIBAL_BASE}} \
    -e NAFARR_BASE={{.NAFARR_BASE}} \
    -e BUILD_ROOT={{.BUILD_ROOT}} \
    -e USER={{.USER}} \
    -e ZEPHYR_SDK_INSTALL_DIR={{.ZEPHYR_SDK_INSTALL_DIR}} \
    -e GCC={{.GCC}} \
    -e RULES_JSON={{.PWD}}/hardware/scala/{{.package}}/{{.TARGET}}/rules.json \
"

env:
  FPGA_FAMILY: ecp5
  FPGA_DEVICE: um5g-45k
  FPGA_PACKAGE: CABGA554
  FPGA_FREQUENCY: 50
  OPENFPGALOADER_BOARD: ecpix5_r03
  PDK_ROOT: "{{.PWD}}/pdks"
  ZIBAL_BASE: "{{.PWD}}/modules/elements/zibal"
  NAFARR_BASE: "{{.ZIBAL_BASE}}/ext/nafarr"
  BUILD_ROOT: "{{.PWD}}/build"
  ZEPHYR_SDK_INSTALL_DIR: "/opt/elements/zephyr-sdk-1.0.1"
  GCC: "{{.ZEPHYR_SDK_INSTALL_DIR}}/gnu/riscv64-zephyr-elf/bin/riscv64-zephyr-elf"
  OPENROAD_FLOW_ROOT: "{{.PWD}}/tools/OpenROAD-flow-scripts/flow"

tasks:
  _project-prepare:
    cmds:
      - virtualenv venv
      - venv/bin/pip3 install podman-compose==1.0.6
      - curl https://storage.googleapis.com/git-repo-downloads/repo > repo
      - chmod a+rx repo
      - ./repo init -u https://github.com/aesc-silicon/ElemRV.git -b {{if .branch}}{{.branch}}{{else}}main{{end}} -m manifest{{.manifest_suffix}}.xml

  _build-container:
    cmds:
      - |
        {{if .CI -}}
        CONTAINER_IMAGE=$(grep 'image:' podman-compose-headless.yml | awk '{print $2}')
        CACHE_DIR="$HOME/.podman-cache"
        CACHE_TAG=$(echo "$CONTAINER_IMAGE" | sed 's/[\/:]/-/g')
        CACHE_FILE="$CACHE_DIR/${CACHE_TAG}.tar"
        mkdir -p "$CACHE_DIR"
        if [ -f "$CACHE_FILE" ]; then
          podman load -q -i "$CACHE_FILE"
        else
          podman pull -q "$CONTAINER_IMAGE"
          podman save -o "$CACHE_FILE" "$CONTAINER_IMAGE"
        fi
        {{- else -}}
        venv/bin/podman-compose pull
        {{- end}}

  repo-sync:
    desc: Downloads and synchronizes all required dependencies.
    cmds:
      - ./repo sync {{if .CI}}-q{{end}}

  install:
    desc: Installs all dependencies and prepares the project for FPGA and chip workflows.
    cmds:
      - task: _project-prepare
      - task: _build-container
      - task: repo-sync
    vars:
      branch: "main"
      manifest_suffix: ""

  install-zephyr:
    desc: Initializes the Zephyr workspace and fetches all Zephyr dependencies.
    cmds:
      - task: west-init
      - task: west-update

  default:
    desc: Executes the full IHP SG13G2 RTL-to-GDSII flow and validates the layout afterwards.
    cmds:
      - task: asic:default
