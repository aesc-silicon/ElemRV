version: '3'

vars:
  arch:
    sh: |
      case "{{.SOC}}" in
        ElemRV-H) echo "rv32i_zicsr" ;;
        ElemRV-N) echo "rv32im_zicsr" ;;
        *) echo ""; echo "Unknown SOC: {{.SOC}}" >&2; exit 1 ;;
      esac

tasks:
  compile:
    desc: Compiles bare metal firmwares.
    cmds:
      - task: ':lib-baremetal-firmware'
        vars:
         app: "bootrom"
      - task: ':lib-baremetal-firmware'
        vars:
         app: "demo"
      - "./software/{{.package}}/gen_baremetal_container.sh"
      - "ln -f {{.BUILD_ROOT}}/{{.SOC}}/{{.board}}/firmware/baremetal_container.img {{.BUILD_ROOT}}/{{.SOC}}/{{.board}}/firmware/image_container.img"

  flash:
    desc: Programs the SPI flash with the compiled baremetal firmware image.
    cmds:
      - "flashrom -p buspirate_spi:dev=/dev/serial/by-id/usb-Bus_Pirate_Bus_Pirate_5_5buspirate-if02,spispeed=8M -c MT25QL256 -l software/{{.package}}/spi.layout -i flash -n -w {{.BUILD_ROOT}}/{{.SOC}}/{{.board}}/firmware/baremetal_container.img"
