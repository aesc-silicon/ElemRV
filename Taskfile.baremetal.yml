version: '3'

vars:
  arch:
    sh: |
      case "{{.SOC}}" in
        ElemRV-H) echo "rv32i_zicsr" ;;
        ElemRV-C) echo "rv32imc_zicsr" ;;
        ElemRV-N) echo "rv32im_zicsr" ;;
        *) echo ""; echo "Unknown SOC: {{.SOC}}" >&2; exit 1 ;;
      esac

tasks:
  compile:
    desc: Compiles bare metal firmwares.
    cmds:
      - task: ':lib-baremetal-firmware'
        vars:
          app: "bootrom"
      - task: ':lib-baremetal-firmware'
        vars:
          app: "demo"
      - "{{.RUN}} './software/{{.package}}/gen_baremetal_container.sh'"
      - "{{.RUN}} 'ln -sf {{.BUILD_ROOT}}/{{.SOC}}/firmware/baremetal_container.img {{.BUILD_ROOT}}/{{.SOC}}/firmware/image_container.img'"
